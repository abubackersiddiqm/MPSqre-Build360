name: Build360 Quality Gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: build360
          POSTGRES_USER: build360
          POSTGRES_PASSWORD: build360-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U build360 -d build360"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      LOCAL_NO_DOCKER: "true"
      DJANGO_SECRET_KEY: build360-ci-django-secret-key-with-more-than-fifty-characters-0001
      JWT_SIGNING_KEY: build360-ci-jwt-signing-key-with-more-than-fifty-characters-0002
      DATABASE_URL: postgresql://build360:build360-ci-password@127.0.0.1:5432/build360
      DATABASE_SSLMODE: prefer
      OBJECT_STORAGE_ENDPOINT: http://127.0.0.1:9000
      OBJECT_STORAGE_ACCESS_KEY: build360-ci-access
      OBJECT_STORAGE_SECRET_KEY: build360-ci-secret
      OBJECT_STORAGE_BUCKET: build360-ci-private
      CRM_PROTECTED_DATA_KEYS: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      CRM_BLIND_INDEX_KEY: build360-ci-blind-index-key
      COMMUNICATION_CALLBACK_KEYS_JSON: '{"ci":"build360-ci-callback-key"}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python manage.py check --deploy
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: ruff check .
      - run: mypy build360 modules
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_BASE_URL: /api/v1
      INTERNAL_API_BASE_URL: http://127.0.0.1:8000/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  repository-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject committed environment secrets
        run: |
          if find . -type f \( -name '.env' -o -name '*.pem' -o -name '*.key' \) \
            -not -path './.git/*' | grep -q .; then
            echo 'Committed secret-like files were detected.' >&2
            exit 1
          fi
      - name: Compile Python source
        run: python -m compileall -q backend/build360 backend/modules
